services:
  wintersweater:
    build: .
    container_name: wintersweater
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./app:/app/app
      - ./data:/data
    environment:
      DATABASE_PATH: /data/wintersweater.db
      PYTHONDONTWRITEBYTECODE: "1"
    command: >
      python -m debugpy
      --listen 0.0.0.0:5678
      --wait-for-client
      -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level debug