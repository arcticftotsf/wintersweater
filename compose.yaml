services:
  wintersweater:
    build: .
    container_name: wintersweater
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/data
    environment:
      DATABASE_PATH: /data/wintersweater.db
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload